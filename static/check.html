<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Browser check - WattBack</title>
<style>body{margin:0;display:grid;place-items:start center;padding:2rem 1rem;min-height:100vh}</style><meta name="color-scheme" content="light dark"><script>try{var d=document.documentElement,g=function(k,f){try{return localStorage.getItem(k)||f}catch(e){return f}},t=g("wb_theme","auto");if(t!=="auto")d.dataset.theme=t;d.dataset.lights=g("wb_lights","on");d.dataset.size=g("wb_size","md");d.dataset.glass=g("wb_glass","on")}catch(e){}</script><link rel="stylesheet" href="/static/site.css?v=9"></head>
<body><main class="page"><h1>Browser check</h1>
<p>Runs a few quick tests on this browser so we can see what is blocked or unsupported. Nothing is sent anywhere.</p>
<table id="t" style="width:100%"><tbody></tbody></table>
<p><button id="cp" type="button">Copy report</button> <span id="cs" role="status"></span></p>
<script>
(function(){
var rows=[],tb=document.querySelector('#t tbody');
function add(name,ok,note){rows.push((ok===true?'PASS ':ok===false?'FAIL ':'INFO ')+name+(note?' - '+note:''));
 var tr=document.createElement('tr'),a=document.createElement('td'),b=document.createElement('td'),c=document.createElement('td');
 a.textContent=name;b.textContent=ok===true?'\u2713':ok===false?'\u2717':'\u2139';c.textContent=note||'';b.style.fontWeight='700';b.style.color=ok===false?'var(--warn)':'var(--acc)';
 [a,b,c].forEach(function(x){x.style.padding='.45rem .6rem';tr.appendChild(x)});tb.appendChild(tr)}
function sup(p,v){try{return !!(window.CSS&&CSS.supports(p,v))}catch(e){return false}}
add('Browser',null,navigator.userAgent);
add('Glass blur (backdrop-filter)',sup('backdrop-filter','blur(2px)')||sup('-webkit-backdrop-filter','blur(2px)'),'Needed for the frosted look; the app falls back to solid panels');
add('Colour mixing (color-mix)',sup('color','color-mix(in srgb, red, blue)'),'Not required any more');
add('Dialogs',typeof HTMLDialogElement==='function','Customize and insights panels');
add('Pointer events (pull cord)',!!window.PointerEvent);
add('Speech (read aloud)',!!window.speechSynthesis);
add('Location support',!!navigator.geolocation);
try{localStorage.setItem('wb_t','1');localStorage.removeItem('wb_t');add('Saved settings (localStorage)',true)}catch(e){add('Saved settings (localStorage)',false,'Blocked: theme and customize choices will not persist')}
add('Dark mode preference',null,(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light');
add('Reduced motion',null,(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)?'on':'off');
function get(u,n,note){return fetch(u).then(function(r){add(n,r.ok,'HTTP '+r.status)}).catch(function(e){add(n,false,note||'Request failed')})}
function script(u,n,note){return new Promise(function(res){var s=document.createElement('script'),t=setTimeout(function(){add(n,false,'Timed out');res()},7000);
 s.src=u;s.onload=function(){clearTimeout(t);add(n,true);res()};s.onerror=function(){clearTimeout(t);add(n,false,note);res()};document.head.appendChild(s)})}
function reach(u,n,note){return fetch(u,{mode:'no-cors'}).then(function(){add(n,true)}).catch(function(){add(n,false,note)})}
get('/auth/config','WattBack server reachable');
get('/tariffs/states','Tariff data loads');
script('https://accounts.google.com/gsi/client','Google sign-in script loads','Blocked by the browser, an extension or a shield (in Opera GX, the shield icon in the address bar). Allow it for this site.')
.then(function(){return reach('https://nominatim.openstreetmap.org/','Address lookup reachable (location button)','Blocked: use the state picker instead')})
.then(function(){return reach('https://api.open-meteo.com/','Weather service reachable','Blocked: results use a default temperature')});
document.getElementById('cp').onclick=function(){var txt=rows.join('\n');
 (navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).then(function(){document.getElementById('cs').textContent='Copied.'}).catch(function(){window.prompt('Copy this report:',txt)})};
})();
</script></main><script src="/static/site.js?v=9"></script></body></html>
